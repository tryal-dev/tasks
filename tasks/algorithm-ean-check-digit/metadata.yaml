hints:
  - "The barcode arrives as Text, but the math needs numbers — take the code apart one character at a time and turn each character into an Integer before summing."
  - "The weights alternate 1, 3, 1, 3, … from the left, so whether a position is odd or even decides its weight. `CopyStr` gives you one character; `Evaluate` turns it into an Integer."
  - "Subtracting the weighted sum's last digit from 10 gives 10 — not 0 — when the sum already ends in 0; a final mod 10 (or an explicit check) closes that hole. For `IsValid`, first reject anything that is not exactly 13 digit characters, then compare the 13th digit with the check digit computed from the first twelve."

