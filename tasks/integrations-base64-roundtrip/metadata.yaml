hints:
  - "Nobody hand-rolls Base64 in AL — the System Application ships a ready-made codec codeunit. Search the symbols for Base64."
  - "Codeunit `\"Base64 Convert\"` has `ToBase64`/`FromBase64` overloads that work directly on streams, and `\"Temp Blob\"` hands out `CreateInStream`/`CreateOutStream` over the bytes it holds."
  - "Encode: create an InStream from the Temp Blob and pass it to `ToBase64` — the overload without the line-break option emits a single line. Decode: create an OutStream and let `FromBase64` write the decoded bytes straight into it."

allowedDependencies:
  - "System Application"
  - "Base Application"
