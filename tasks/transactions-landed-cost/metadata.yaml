id: transactions-landed-cost
sortId: 105
title: "Landed Cost: Spread the Freight Across the Receipts"
author: "@Drakonian"
difficulty: medium
topic: transactions
tags:
  - item-charge
  - landed-cost
  - purchase-invoice
  - value-entry
